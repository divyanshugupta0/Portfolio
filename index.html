<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6LcD0wArAAAAAKyer34aBTF7jyjWnhCgSWT85u37"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire-Auth | Verification</title>
    <link rel="icon" href="auth.png" type="image/x-icon">
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #2ecc71;
            --background-gradient: linear-gradient(135deg, #141e30, #243b55);
            --card-gradient: linear-gradient(to bottom right, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.8));
            --text-color: #333333;
            --border-radius: 20px;
            --box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--background-gradient);
            color: var(--text-color);
            transition: all 0.5s ease;
        }

        .text-center {
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #2c5282, #2b6cb0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .container {
            background: var(--card-gradient);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 2.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            max-width: 550px;
            width: 90%;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .loader {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        #error-message {
            color: #dc2626;
            font-weight: 600;
            display: none;
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.3);
            text-align: center;
            margin: 1rem 0;
        }

        .verification-details {
            background: rgba(255, 255, 255, 0.95);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-top: 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            text-align: left;
            color: #333333;
        }

        .check-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: #333333;
        }

        .check-item.passed {
            opacity: 1;
            transform: translateY(0);
        }

        .check-icon {
            margin-right: 1rem;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            position: relative;
            overflow: hidden;
            color: #ffffff;
        }

        .check-icon.success {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.3);
        }

        .check-icon.fail {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.3);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.1);
            margin-top: 1.5rem;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Secure Verification</h1>
        <p id="status-message">Verifying system...</p>
        <div class="loader" id="loader"></div>
        <div id="error-message">Verification Failed</div>
        <div id="verification-details" class="verification-details" style="display:none;">
            <h3>Verification Checks</h3>
            <div id="security-checks"></div>
            <div class="progress-bar">
                <div id="progress-bar-fill" class="progress-bar-fill"></div>
            </div>
            <h6>Powered by: Fire-Auth <br>Version 4.1.0.1</h6>
        </div>
    </div>

    <script>
    // Check for existing token and redirect if valid
    function checkExistingToken() {
        const token = sessionStorage.getItem('token');
        const expiry = sessionStorage.getItem('sessionExpiry');
        
        if (token && expiry) {
            const currentTime = new Date().getTime();
            if (currentTime < parseInt(expiry)) {
                const currentPath = window.location.pathname;
                const basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
                window.location.href = `${basePath}port.html?token=${token}`;
                return true;
            }
        }
        return false;
    }

    class SecurityVerification {
        constructor() {
            this.securityChecks = [
                { 
                    name: 'Browser Capabilities', 
                    check: () => !!window.navigator && !!window.screen 
                },
                { 
                    name: 'Storage Access', 
                    check: () => typeof window.localStorage !== 'undefined' && 
                                typeof window.sessionStorage !== 'undefined' 
                },
                { 
                    name: 'Crypto Support', 
                    check: () => typeof window.crypto === 'object' && 
                                typeof window.crypto.getRandomValues === 'function' 
                },
                { 
                    name: 'Modern Browser Features', 
                    check: () => typeof Promise === 'function' && 
                                typeof fetch === 'function' 
                },
                { 
                    name: 'Connection Security', 
                    check: async () => {
                        try {
                            const checks = [
                                navigator.onLine,
                                window.location.protocol === 'https:',
                                await this.testNetworkConnectivity(),
                                window.isSecureContext,
                                this.validateTLSSupport()
                            ];
                            return checks.filter(Boolean).length >= 4;
                        } catch (error) {
                            console.error('Connection security check failed:', error);
                            return false;
                        }
                    }
                },
                { 
                    name: 'Platform Integrity', 
                    check: () => !this.detectVirtualEnvironment() 
                }
            ];
        }

        // Network connectivity test
        async testNetworkConnectivity() {
            const urls = [
                'https://www.google.com',
                'https://www.cloudflare.com',
                'https://www.microsoft.com'
            ];

            try {
                const tests = urls.map(async (url) => {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 3000);
                        
                        const response = await fetch(url, {
                            method: 'HEAD',
                            signal: controller.signal
                        });
                        
                        clearTimeout(timeoutId);
                        return response.ok;
                    } catch (error) {
                        return false;
                    }
                });

                const results = await Promise.all(tests);
                return results.some(Boolean);
            } catch {
                return false;
            }
        }

        validateTLSSupport() {
            try {
                const tlsVersions = ['TLS 1.2', 'TLS 1.3'];
                return tlsVersions.some(version => 
                    navigator.userAgent.includes(version)
                );
            } catch {
                return false;
            }
        }

        detectEnvironment() {
            const ua = navigator.userAgent.toLowerCase();
            return {
                platform: this.detectPlatform(ua),
                browser: this.detectBrowser(ua),
                os: this.detectOS(ua)
            };
        }

        detectPlatform(ua) {
            if (/mobile|android|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua)) {
                return 'Mobile';
            }
            if (/tablet|ipad/i.test(ua)) {
                return 'Tablet';
            }
            return 'Desktop';
        }

        detectBrowser(ua) {
            if (ua.includes('chrome')) return 'Chrome';
            if (ua.includes('firefox')) return 'Firefox';
            if (ua.includes('safari')) return 'Safari';
            if (ua.includes('edge')) return 'Edge';
            if (ua.includes('trident')) return 'Internet Explorer';
            return 'Unknown';
        }

        detectOS(ua) {
            if (ua.includes('windows')) return 'Windows';
            if (ua.includes('mac')) return 'MacOS';
            if (ua.includes('linux')) return 'Linux';
            if (ua.includes('android')) return 'Android';
            if (ua.includes('iphone') || ua.includes('ipad')) return 'iOS';
            return 'Unknown';
        }

        detectVirtualEnvironment() {
            const virtualSignatures = [
                'phantom', 'selenium', 'webdriver',
                'electron', 'bot', 'crawler'
            ];

            return virtualSignatures.some(sig => 
                navigator.userAgent.toLowerCase().includes(sig)
            );
        }

        async performSecurityChecks() {
            const results = await Promise.all(
                this.securityChecks.map(async (check) => ({
                    name: check.name,
                    passed: await check.check()
                }))
            );

            const passedChecks = results.filter(r => r.passed).length;
            const totalChecks = results.length;
            const passRate = (passedChecks / totalChecks) * 100;

            return {
                passed: passRate >= 75,
                results: results,
                environment: this.detectEnvironment()
            };
        }

        async verify() {
            try {
                return await this.performSecurityChecks();
            } catch (error) {
                console.error('Verification failed:', error);
                return { 
                    passed: false, 
                    error: error.message 
                };
            }
        }
    }

    async function startVerification() {
        // First check if we have a valid token
        if (checkExistingToken()) {
            return;
        }

        const verifier = new SecurityVerification();
        const securityChecksContainer = document.getElementById('security-checks');
        const progressBarFill = document.getElementById('progress-bar-fill');
        
        try {
            document.getElementById('verification-details').style.display = 'block';
            
            const result = await verifier.verify();
            
            result.results.forEach((checkResult, index) => {
                const checkElement = document.createElement('div');
                checkElement.classList.add('check-item');
                
                const iconElement = document.createElement('div');
                iconElement.classList.add('check-icon', checkResult.passed ? 'success' : 'fail');
                iconElement.textContent = checkResult.passed ? '✓' : '✗';
                
                const textElement = document.createElement('span');
                textElement.textContent = checkResult.name;
                
                checkElement.appendChild(iconElement);
                checkElement.appendChild(textElement);
                securityChecksContainer.appendChild(checkElement);

                setTimeout(() => {
                    checkElement.classList.add('passed');
                }, index * 200);
            });

            const passRate = (result.results.filter(r => r.passed).length / result.results.length) * 100;
            setTimeout(() => {
                progressBarFill.style.width = `${passRate}%`;
            }, 500);
            
            if (result.passed) {
                document.getElementById('status-message').textContent = 'Verification Successful';
                
                const token = Math.random().toString(36).substring(2) + Date.now().toString(36);
                sessionStorage.setItem('token', token);
                
                const expiryTime = new Date().getTime() + (5 * 60 * 1000);
                sessionStorage.setItem('sessionExpiry', expiryTime.toString());
                
                const currentPath = window.location.pathname;
                const basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
                
                setTimeout(() => {
                    window.location.href = `${basePath}port.html?token=${token}`;
                }, 2000);


            } else {
                throw new Error('Verification failed');
            }
        } catch (error) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('status-message').textContent = 'Access Denied';
            
            console.error('Verification error:', error);
        }
    }

    // Initialize verification on page load
    window.onload = startVerification;
    </script>
